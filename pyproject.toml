[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

# Only include source files, README and LICENSE in .tar.gz file
[tool.hatch.build.targets.sdist]
include = ["convolinear/**", "README.md", "LICENSE"]

# Only include source files in .whl file
[tool.hatch.build.targets.wheel]
packages = ["convolinear"]

[project]
name = "convolinear"
version = "0.2.0"
description = "A fluent time-series and signal processing library for building data pipelines in a single line of Python."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Sajid Ahmed", email = "bracer.chasm-8i@icloud.com" },
]
keywords = ["fluent", "data", "time-series", "signal-processing", "dsp", "audio", "fft", "filter"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Typing :: Typed",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23.2",
    "scipy>=1.8.0",
]

[project.optional-dependencies]
plot   = ["matplotlib>=3.4.0"]
pandas = ["pandas>=2.0", "pyarrow>=14.0"]
audio = ["soundfile>=0.13.0"]

[project.urls]
Homepage   = "https://github.com/sahmed0/convolinear#readme"
Repository = "https://github.com/sahmed0/convolinear"
Issues     = "https://github.com/sahmed0/convolinear/issues"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.14",
    "scipy-stubs>=1.14",
    "pandas-stubs>=2.0",
    "matplotlib>=3.4",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "soundfile>=0.13.0",
]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-jupyter>=0.25",
    "pooch>=1.8",        # scipy.datasets backend for the ECG notebook
]
bench = [
    "pytest-benchmark>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY", "RUF"]

[tool.coverage.run]
source = ["convolinear"]

[tool.mypy]
files = ["convolinear"]
# scipy-stubs ships PEP 695 `type` statements that mypy only parses under 3.12+;
# the package itself still targets 3.11+ and uses no 3.12-only syntax.
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["soundfile"]
ignore_missing_imports = true